# Redirect all unencrypted HTTP traffic to HTTPS
server {
    listen 80;
    server_name localhost; # Change this to your actual domain if you have one
    
    return 302 https://$host$request_uri;
}

# The main HTTPS Server
server {
    listen 443 ssl;
    server_name localhost; 

    # Point Nginx to the SSL certificate and key
    ssl_certificate /etc/nginx/ssl/bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/bundle.key;

    # Basic security enhancements
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Route requests for / to the mounted HTML directory
    location / {
        include /etc/nginx/security-headers.conf;
        root /html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    # 2. Proxy requests for /api to the APP container
    location /api {
        proxy_pass http://api:8000/api;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Proxy requests for /docs to the APP container
    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Proxy requests for /docs to the APP container
    location /auth {
        proxy_pass http://api:8000/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Route requests for /ram to the shared RAM disk
    location /ram {
        include /etc/nginx/security-headers.conf;
        alias /ram;
        autoindex on; 
    }
}

