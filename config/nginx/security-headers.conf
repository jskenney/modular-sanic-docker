# Browser security headers for the files nginx serves itself.  Responses
# proxied to the api container already carry these from modular-sanic (which
# also sends HSTS when HSTS is set in .env), so they are not added there.
#
# The bundled pages use inline <script> blocks.  modular-sanic allows them by
# hash when it serves pages; nginx cannot compute hashes, so script-src
# allows inline scripts here.  Everything else is restricted to this site,
# and frame-ancestors / X-Frame-Options stop the pages being framed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
